    </script><!-- Global Theme Toggle Logic --><script>
    document.addEventListener("DOMContentLoaded", function() {
        const themeToggleBtn = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");

        if (!themeToggleBtn) return;

        function updateIcon() {
            if (document.documentElement.getAttribute("data-theme") === "dark") {
                themeIcon.textContent = "☀️";
            } else {
                themeIcon.textContent = "🌙";
            }
        }

        updateIcon();

        themeToggleBtn.addEventListener("click", () => {
            let currentTheme = document.documentElement.getAttribute("data-theme");
            if (currentTheme === "dark") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
            }
            updateIcon();
        });
    });
    </script><!-- Global Cart Badge Initialization --><script>
    document.addEventListener("DOMContentLoaded", function() {
        window.updateCartBadge = function() {
            const badge = document.getElementById('cart-count-badge');
            if (badge) {
                let cart = JSON.parse(localStorage.getItem('rocola_cart')) || {};
                const totalUniqueItems = Object.keys(cart).length;
                badge.innerText = totalUniqueItems;
                badge.style.display = totalUniqueItems > 0 ? 'inline-block' : 'none';
            }
        };
        // Run immediately on page load to set the correct number globally
        window.updateCartBadge();
    });
    </script>
